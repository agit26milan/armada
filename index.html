<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A React + TypeScript example app with a feature-based architecture, TanStack Router, TanStack Query, and Zustand."
    />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('trans:theme') ?? 'null')
          const mode =
            stored?.state?.mode ??
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')

          document.documentElement.classList.toggle('dark', mode === 'dark')
          document.documentElement.style.colorScheme = mode
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
    />
    <title>Trans · Feature-based React Starter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
